# Проверки на каждый push и PR: то же, что прогоняется перед выкатом руками,
# только без «забыл прогнать».

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Та же версия, что в бою: тесты ходят в настоящий Postgres, а
      # test_migrations накатывает на него все миграции с нуля.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema
          POSTGRES_DB: cinema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinema"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://cinema:cinema@localhost:5432/cinema
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      # tsc -b, а не tsc --noEmit: корневой tsconfig — только ссылки на
      # проекты («files»: []), и без -b он не проверяет ни одного файла.
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build
